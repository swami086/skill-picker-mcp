[project]
name = "skill-picker-mcp"
version = "0.1.0"
description = "Local MCP: pick Cursor skills via FTS5 + sqlite-vec hybrid search"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9.0,<2",
  "numpy>=2.4.6",
  "pyyaml>=6.0",
  "sentence-transformers>=6.1.0",
  "sqlite-vec>=0.1.9",
  "torch>=2.2.0",
]

[project.scripts]
skill-picker-mcp = "skill_picker_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_picker_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/skill_picker_mcp" = "skill_picker_mcp"

# CPU-only torch for portable Docker / no NVIDIA wheels
# https://docs.astral.sh/uv/guides/integration/pytorch/
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
